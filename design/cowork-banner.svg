<svg width="840" height="1052" viewBox="0 0 840 1052" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="1052" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="60" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="1052" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="105" x2="840" y2="105"/>
    <line x1="0" y1="210" x2="840" y2="210"/>
    <line x1="0" y1="315" x2="840" y2="315"/>
    <line x1="0" y1="420" x2="840" y2="420"/>
    <line x1="0" y1="525" x2="840" y2="525"/>
    <line x1="0" y1="630" x2="840" y2="630"/>
    <line x1="0" y1="735" x2="840" y2="735"/>
    <line x1="0" y1="840" x2="840" y2="840"/>
    <line x1="0" y1="945" x2="840" y2="945"/>
    <line x1="105" y1="0" x2="105" y2="1052"/>
    <line x1="210" y1="0" x2="210" y2="1052"/>
    <line x1="315" y1="0" x2="315" y2="1052"/>
    <line x1="420" y1="0" x2="420" y2="1052"/>
    <line x1="525" y1="0" x2="525" y2="1052"/>
    <line x1="630" y1="0" x2="630" y2="1052"/>
    <line x1="735" y1="0" x2="735" y2="1052"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="840" height="6" fill="url(#accentLine)"/>

  <!-- Main content area -->
  <!-- "BUILD" text -->
  <text x="420" y="340" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">BUILD</text>

  <!-- "AI" text with green gradient highlight -->
  <text x="420" y="490" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="160" font-weight="900" fill="#10B981" text-anchor="middle" letter-spacing="-4">AI</text>

  <!-- Divider line -->
  <rect x="60" y="530" width="720" height="3" fill="url(#accentLine)" rx="2"/>

  <!-- Cowork subtitle -->
  <text x="420" y="600" font-family="'Arial', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="8">COWORK</text>

  <!-- Session details -->
  <text x="420" y="690" font-family="'Arial', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#64748B" text-anchor="middle">Every Monday · 13:30–15:30 Israel time</text>

  <!-- Star/sparkle decorations -->
  <!-- Top-left star -->
  <path d="M100 200L110 230L140 240L110 250L100 280L90 250L60 240L90 230Z" fill="#7C3AED" opacity="0.7"/>
  <!-- Bottom-right star -->
  <path d="M740 820L750 850L780 860L750 870L740 900L730 870L700 860L730 850Z" fill="#10B981" opacity="0.7"/>
  <!-- Small dot decorations -->
  <circle cx="120" cy="480" r="6" fill="#10B981" opacity="0.5"/>
  <circle cx="720" cy="360" r="6" fill="#7C3AED" opacity="0.5"/>
  <circle cx="160" cy="700" r="4" fill="#F59E0B" opacity="0.4"/>
  <circle cx="680" cy="580" r="4" fill="#F59E0B" opacity="0.4"/>

  <!-- Bottom section -->
  <text x="420" y="960" font-family="'Arial', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">Open-source · Learn by shipping · AI agents</text>

  <!-- Bottom accent line -->
  <rect x="0" y="1046" width="840" height="6" fill="url(#accentLine)"/>
</svg>
